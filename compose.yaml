services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: access_requests
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/bootstrap/init.sql:ro
      - ./db/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d access_requests
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  n8n-bootstrap:
    image: n8nio/n8n:2.42.7
    restart: "no"
    init: true
    entrypoint: ["node", "/bootstrap/import.mjs"]
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Kyiv}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL:-http://localhost:5680/}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      SLACK_ENABLED: ${SLACK_ENABLED:-false}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_WORKSPACE_ID: ${SLACK_WORKSPACE_ID:-}
      SLACK_REQUESTS_CHANNEL_ID: ${SLACK_REQUESTS_CHANNEL_ID:-}
      SLACK_APPROVALS_CHANNEL_ID: ${SLACK_APPROVALS_CHANNEL_ID:-}
      SLACK_REVIEW_CHANNEL_ID: ${SLACK_REVIEW_CHANNEL_ID:-}
      PUBLIC_WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL:-http://localhost:5680/}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./bootstrap:/bootstrap:ro
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.42.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5680}:5678"
    environment:
      TZ: ${GENERIC_TIMEZONE:-Europe/Kyiv}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Kyiv}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL:-http://localhost:5680/}
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      n8n-bootstrap:
        condition: service_completed_successfully

volumes:
  postgres_data:
  n8n_data:
